name: Katalon Web E2E Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Katalon Studio Test Suite
        uses: katalon-studio/katalon-studio-github-action@v2
        with:
          version: '9.3.0'
          projectPath: '${{ github.workspace }}'
          args: '-noSplash -runMode=console -projectPath="${{ github.workspace }}" -retry=0 -testSuitePath="Test Suites/TS_Web_Petstore" -executionProfile="default" -browserType="Chrome (Headless)" -apiKey="${{ secrets.KATALON_PETSTORE_API }}"'

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katalon-web-reports
          path: Reports/